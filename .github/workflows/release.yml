# Release pipeline: publish a framework-dependent single-file exe (win-x64),
# packaged as a zip that contains the fixed-name WindowMerger.exe. Publish
# settings come from the committed VS publish profile
# (Properties/PublishProfiles/FolderProfile.pubxml).
# Three trigger paths:
#   1. push to main             -> prerelease Release on the fixed rolling
#      'nightly' tag (force-moved to the built commit each run, never
#      accumulating per-commit tags); version = 0.0.1.<commit sha first 8>
#   2. push a v* tag            -> Release from the tag itself
#   3. workflow_dispatch        -> fill in "version" to release from the current
#      branch HEAD (tag auto-created at the built commit, optional prerelease
#      flag); leave "version" empty to build the artifact only, no Release.
name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 or 0.1.0-alpha.1 (leading v optional). Empty = build only, no Release.'
        required: false
        default: ''
      prerelease:
        description: 'Mark the Release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # the nightly Release is delete/recreate shared state; serialize runs on the
  # same ref so two quick main pushes cannot race on it (tag pushes each get
  # their own group)
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $prerelease = ($env:INPUT_PRERELEASE -eq 'true')
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'tag') {
            # tag push: release from the tag itself
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            $tag = $env:GITHUB_REF_NAME
            $shouldRelease = 'true'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            # main branch push: prerelease Release on the fixed rolling 'nightly' tag
            $version = '0.0.1.{0}' -f $env:GITHUB_SHA.Substring(0, 8)
            $tag = 'nightly'
            $shouldRelease = 'true'
            $prerelease = $true
          } elseif ($env:INPUT_VERSION) {
            # manual dispatch with a version: release from the branch HEAD
            $version = $env:INPUT_VERSION -replace '^v', ''
            $tag = "v$version"
            $shouldRelease = 'true'
          } else {
            # manual dispatch without a version: build only, no Release
            [xml]$csproj = Get-Content -Raw -Encoding UTF8 'WindowMerger.csproj'
            $version = @($csproj.Project.PropertyGroup)[0].Version
            $tag = ''
            $shouldRelease = 'false'
          }
          if (-not $version) { throw 'Cannot resolve version (tag name, input or csproj).' }
          Write-Output "Version: $version | Tag: $tag | Release: $shouldRelease | Prerelease: $prerelease"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "should_release=$shouldRelease" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: "Publish (VS publish profile: framework-dependent single-file, win-x64)"
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dotnet publish WindowMerger.csproj -c Release -p:PublishProfile=FolderProfile `
            -p:TreatWarningsAsErrors=true -p:Version=$env:VERSION

      - name: Stage artifact (zip containing the fixed-name WindowMerger.exe)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $asset = 'publish\WindowMerger-{0}-win-x64.zip' -f $env:VERSION
          Compress-Archive -Path 'publish\WindowMerger.exe' -DestinationPath $asset -Force
          Get-ChildItem $asset, 'publish\WindowMerger.exe' | Format-Table Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowMerger-${{ steps.ver.outputs.version }}-win-x64
          path: publish/WindowMerger-*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.ver.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          $asset = 'publish\WindowMerger-{0}-win-x64.zip' -f $env:VERSION
          $ghArgs = @('release', 'create', $env:TAG, $asset)
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # tag push: the tag already exists, verify it points at this commit
            $ghArgs += @('--verify-tag', '--title', "WindowMerger $env:TAG",
              '--generate-notes')
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            # main push: roll the fixed 'nightly' tag onto this commit, then
            # republish its prerelease Release (no per-commit tag accumulation)
            gh release delete $env:TAG --yes
            if ($LASTEXITCODE -eq 0) {
              Write-Output "Existing '$env:TAG' Release deleted"
            } else {
              Write-Output "No existing '$env:TAG' Release, skip delete (first run)"
            }
            git tag --force $env:TAG $env:GITHUB_SHA
            git push --force origin $env:TAG
            Write-Output "Tag '$env:TAG' moved to $env:GITHUB_SHA"
            $ghArgs += @('--title', "WindowMerger $env:VERSION (nightly)",
              '--notes', "Automated prerelease build of main at commit $env:GITHUB_SHA")
          } else {
            # manual release: create the tag at this exact commit
            $ghArgs += @('--target', $env:GITHUB_SHA,
              '--title', "WindowMerger $env:TAG", '--generate-notes')
          }
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh @ghArgs
          Write-Output "Release created: $env:TAG"
