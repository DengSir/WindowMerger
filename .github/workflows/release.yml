# Release pipeline: push a v* tag -> build a framework-dependent single-file
# exe (win-x64) and attach it to a GitHub Release. Publish settings come from
# the committed VS publish profile (Properties/PublishProfiles/FolderProfile.pubxml).
# Manual dispatch (from the Actions page) builds the artifact only, no Release.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            # tag push: version = tag name without the leading 'v'
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            # manual dispatch: fall back to the version in the csproj
            [xml]$csproj = Get-Content -Raw -Encoding UTF8 'WindowMerger.csproj'
            $version = @($csproj.Project.PropertyGroup)[0].Version
          }
          if (-not $version) { throw 'Cannot resolve version (tag name or csproj).' }
          Write-Output "Resolved version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (VS publish profile: framework-dependent single-file, win-x64)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dotnet publish WindowMerger.csproj -c Release -p:PublishProfile=FolderProfile `
            -p:TreatWarningsAsErrors=true -p:Version=$env:VERSION

      - name: Stage artifact
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $asset = 'publish\WindowMerger-{0}-win-x64.exe' -f $env:VERSION
          Copy-Item 'publish\WindowMerger.exe' $asset -Force
          Get-ChildItem 'publish' | Format-Table Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowMerger-${{ steps.ver.outputs.version }}-win-x64
          path: publish/WindowMerger-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $asset = 'publish\WindowMerger-{0}-win-x64.exe' -f $env:VERSION
          gh release create $env:GITHUB_REF_NAME $asset `
            --title 'WindowMerger ${{ github.ref_name }}' `
            --verify-tag --generate-notes
