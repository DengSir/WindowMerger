# Release pipeline: publish a framework-dependent single-file exe (win-x64),
# packaged as a zip that contains the fixed-name WindowMerger.exe. Publish
# settings come from the committed VS publish profile
# (Properties/PublishProfiles/FolderProfile.pubxml).
# All step logic lives in tools/ci/release.py (pure stdlib, same Python stack
# as the repo's tooling) so it is locally testable with --dry-run.
# Two trigger paths:
#   1. push a v* tag            -> Release from the tag itself
#   2. workflow_dispatch        -> fill in "version" to release from the current
#      branch HEAD (tag auto-created at the built commit, optional prerelease
#      flag); leave "version" empty to build the artifact only, no Release.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0 or 0.1.0-alpha.1 (leading v optional). Empty = build only, no Release.'
        required: false
        default: ''
      prerelease:
        description: 'Mark the Release as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发版门禁：复用 test.yml（同构建 + 全量回归），测试不过不发版
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup uv (Python toolchain, same as repo tooling)
        uses: astral-sh/setup-uv@v5

      - name: Resolve version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: uv run --frozen tools/ci/release.py resolve

      - name: "Publish (VS publish profile: framework-dependent single-file, win-x64)"
        shell: bash
        env:
          MSBUILD_VERSION: ${{ steps.ver.outputs.msbuild_version }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: >
          dotnet publish WindowMerger.csproj -c Release -p:PublishProfile=FolderProfile
          -p:TreatWarningsAsErrors=true -p:Version="$MSBUILD_VERSION"
          -p:InformationalVersion="$VERSION"

      - name: Stage artifact (zip containing the fixed-name WindowMerger.exe)
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: uv run --frozen tools/ci/release.py stage

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowMerger-${{ steps.ver.outputs.version }}-win-x64
          path: publish/WindowMerger-*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.ver.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: uv run --frozen tools/ci/release.py release
