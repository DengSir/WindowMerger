# GUI regression on a real Windows desktop: windows-latest runners have an
# interactive session (RDP; the desktop is small enough that the whole
# 1024x768-bounded test layout fits), so injected input / UIA / PrintWindow all
# work — the repo's full suite runs unattended. Dual-monitor / cross-DPI tests
# self-SKIP (cross_dpi_seam). Layout adapts via wm.test_layout() (anchored to
# the preferred 96-DPI monitor, bounded by 1024x768). Locale-sensitive
# assertions match both zh/en window titles.
# Public repo -> Actions minutes are free.
name: Tests

on:
  push:
    # 任意分支的 push 都跑全量回归（功能分支不开 PR 也有 CI）。branches 过滤天然排除
    # tag——tag 由 release.yml 触发（其 test job 经 workflow_call 跑同款），不重复；
    # '**' 必须加引号（防 YAML alias 解析），且能跨过斜杠分支名（feature/x）
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:  # release.yml 复用本工作流当发版门禁：同一套构建 + 全量回归，不过不发版

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      PYTHONIOENCODING: utf-8  # CI 控制台 cp1252 会编码不了中文/FA 字形输出
      # 测试环境与真实 GitHub API 彻底断网：被测宿主不启动自动检查——匿名限流看脸、
      # 线上版本 vs CI 构建版本的版本差都会改变被测行为（模态框事故根因）；
      # update_e2e/update_edge 用 WM_UPDATE_API 指本地假服务，手动检查不受影响
      WM_UPDATE_OFF: 1
      # 无参启动回退旧语义（仅主窗、关窗即退出）：不起托盘、不占 mutex、不注册热键；
      # 组合模式新语义由 noargs_tray_test 自行剥掉验证
      WM_NO_TRAY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup uv (Python toolchain)
        # setup-uv 无 v10 浮动 major tag（v8.0.0 起只发完整版本 tag，immutable）——
        # 必须钉完整版本号；@v10 直接 "unable to find version v10"
        uses: astral-sh/setup-uv@v10.3.3

      - name: Build (must be 0 warnings 0 errors)
        shell: bash
        run: dotnet build -c Release

      - name: Configure WER crash dumps for WindowMerger.exe
        # 宿主进程未处理异常崩溃时 WER 落全量 dump 到 workspace dumps/（失败时上传产物，
        # 配同次构建的 exe+pdb 才能离线分析——reveal-timer 关窗竞态崩溃那类问题的 CI 取证
        # 手段）。runner 有管理员权限，HKLM 可写；LocalDumps 在崩溃瞬间读取，无需重启服务。
        # DumpType=2 全量 dump：.NET 崩溃 mini dump（1）常缺堆、SOS 看不了状态。
        shell: pwsh
        run: |
          $dumpDir = "$env:GITHUB_WORKSPACE\dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $wer = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\WindowMerger"
          New-Item -Force -Path $wer | Out-Null
          Set-ItemProperty -Path $wer -Name DumpFolder -Value $dumpDir -Type ExpandString
          Set-ItemProperty -Path $wer -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty -Path $wer -Name DumpCount -Value 5 -Type DWord

      - name: Run full regression suite
        shell: bash
        run: uv run --frozen tools/run_all.py

      - name: Upload test build (exe + pdb + runtime pieces) and crash dumps
        # 失败才上传（成功轮没人下载 exe/pdb）：五件套 + dumps/*.dmp 同包同 run——
        # dump 分析的符号/二进制与 dump 天然同 run 精确匹配。
        # exe 单独跑不起来（框架依赖 apphost 要 dll/deps/runtimeconfig 成套）；
        # **托管代码在 WindowMerger.dll**（exe 只是 apphost 引导器），pdb 与本 run 构建
        # 精确匹配；release.yml publish 的 single-file exe 是另一份二进制、与此无配对关系。
        # dumps/*.dmp 只在宿主真实崩溃（未处理异常）时存在，无崩溃的失败轮为空不占体积
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-build
          path: |
            bin/Release/net10.0-windows/WindowMerger.exe
            bin/Release/net10.0-windows/WindowMerger.dll
            bin/Release/net10.0-windows/WindowMerger.pdb
            bin/Release/net10.0-windows/WindowMerger.deps.json
            bin/Release/net10.0-windows/WindowMerger.runtimeconfig.json
            dumps/*.dmp
          if-no-files-found: ignore

      - name: Upload failure screenshots (tests save wm_*.png to user temp)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: C:\Users\runneradmin\AppData\Local\Temp\wm_*.png
          if-no-files-found: ignore
